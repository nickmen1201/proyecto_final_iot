# Plataforma FIWARE del proyecto (EC2, carpeta ~/fiware).
# Reconstruido a partir de "docker compose config" de la EC2 (2026-10-21):
# mismos servicios, imagenes, variables, puertos y volumenes.
# Ver nube/README.md.
#
# Versiones actualizadas el 2026-11-11 (mongo 6.0 y crate 4.8 ya no tienen
# soporte). Combinacion probada de punta a punta en local: aprovisionamiento,
# POST al agente, entidad en Orion, notificacion y fila en CrateDB.
#   orion 4.1.0 -> 4.5.0   (ultima imagen publicada)
#   mongo 6.0   -> 8.0     (version de referencia de Orion desde la 4.2.0)
#   crate 4.8.1 -> 6.5.1
#   iotagent-json 3.14.0 y quantumleap 1.0.0 ya son las ultimas.
# Mongo 8 no abre datos de 6.0 y CrateDB 6 no lee tablas creadas en 4.x: al
# migrar se borran los volumenes (docker compose down -v) y se vuelve a
# correr provisionamiento.sh. El historico anterior no se conserva.
#
# Capa curada y de decisiones (2026-11-11): postgres + limpiar + analitica +
# api + front. Requiere un archivo .env junto a este compose (no va a Git):
#   PG_PASSWORD=<una clave>
#   DOMINIO=34-237-180-187.sslip.io   (sin definir: localhost, para pruebas)

services:
  # Estado actual de las entidades (NGSI-v2).
  orion:
    image: quay.io/fiware/orion:4.5.0
    restart: unless-stopped
    depends_on:
      - mongo-db
    ports:
      # Solo localhost (para provisionamiento.sh): Orion no queda expuesto a
      # Internet aunque alguien abra el puerto en el Security Group. El
      # agente y la API le llegan por la red interna de Docker.
      - "127.0.0.1:1026:1026"
    command: -dbURI mongodb://mongo-db -logLevel INFO

  # Base de datos de Orion y del IoT Agent. Sin puerto publicado.
  mongo-db:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-db:/data/db

  # Recibe las medidas del gateway por HTTP (5555) y las pasa a Orion.
  iot-agent:
    image: quay.io/fiware/iotagent-json:3.14.0-distroless
    restart: unless-stopped
    depends_on:
      - mongo-db
      - orion
    ports:
      - "127.0.0.1:4041:4041"   # northbound: aprovisionamiento, solo localhost
      - "5555:5555"             # southbound: medidas del gateway
    environment:
      IOTA_CB_HOST: orion
      IOTA_CB_PORT: "1026"
      IOTA_CB_NGSI_VERSION: v2
      IOTA_NORTH_PORT: "4041"
      IOTA_HTTP_PORT: "5555"
      IOTA_DEFAULT_RESOURCE: /iot/json
      IOTA_PROVIDER_URL: http://iot-agent:4041
      IOTA_REGISTRY_TYPE: mongodb
      IOTA_MONGO_URI: mongodb://mongo-db:27017/iotagentjson
      IOTA_TIMESTAMP: "true"
      IOTA_AUTOCAST: "true"
      IOTA_MQTT_DISABLED: "true"
      IOTA_AMQP_DISABLED: "true"
      IOTA_LOG_LEVEL: DEBUG

  # Recibe las notificaciones de Orion y guarda el historico en CrateDB.
  quantumleap:
    image: orchestracities/quantumleap:1.0.0
    restart: unless-stopped
    depends_on:
      - crate-db
    environment:
      CRATE_HOST: crate-db

  # Base de datos del historico. 4200: API SQL y consola web.
  crate-db:
    image: crate:6.5.1
    restart: unless-stopped
    ports:
      - "4200:4200"
    command: >-
      crate
      -Cauth.host_based.enabled=false
      -Ccluster.name=democluster
      -Chttp.cors.enabled=true
      -Chttp.cors.allow-origin=*
      -Cdiscovery.type=single-node
    environment:
      CRATE_HEAP_SIZE: 1g
    volumes:
      - crate-db:/data

  # ------------------------------------------------------------------
  # Capa curada y de decisiones. Ver nube/servicios/ y nube/README.md.
  # ------------------------------------------------------------------

  # Datos curados, indicadores y decisiones. Sin puerto publicado.
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: agricultura
      POSTGRES_USER: agro
      POSTGRES_PASSWORD: ${PG_PASSWORD:?definir PG_PASSWORD en nube/.env}
    volumes:
      # en la imagen 18 el volumen es /var/lib/postgresql (no .../data)
      - postgres:/var/lib/postgresql
      - ./servicios/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # CrateDB (crudo) -> Postgres (medidas_limpias).
  # Unico servicio con "build": analitica y api reusan la misma imagen
  # (construirla tres veces en paralelo hace que el build falle por carrera).
  limpiar:
    build: ./servicios
    image: fiware-servicios
    command: python limpiar.py
    restart: unless-stopped
    depends_on: [crate-db, postgres]
    environment:
      PG_PASSWORD: ${PG_PASSWORD}

  # CrateDB (crudo) -> resumen_horario, indicadores y decisiones (R1..R5).
  analitica:
    image: fiware-servicios
    command: python analitica.py
    restart: unless-stopped
    depends_on: [crate-db, postgres]
    environment:
      PG_PASSWORD: ${PG_PASSWORD}
      SIN_DATOS_MIN: ${SIN_DATOS_MIN:-5}

  # Consulta Postgres y Orion para el front. Solo accesible via Caddy.
  api:
    image: fiware-servicios
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    depends_on: [postgres, orion]
    environment:
      PG_PASSWORD: ${PG_PASSWORD}

  # Pagina estatica + proxy de /api/*. Unico servicio nuevo expuesto:
  # Caddy consigue y renueva solo el certificado TLS del DOMINIO.
  front:
    image: caddy:2.11.9
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:-localhost}
    volumes:
      - ./front:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  mongo-db:
  crate-db:
  postgres:
  caddy:
