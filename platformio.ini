; Proyecto final IoT - Agricultura
;
; Un solo proyecto, dos firmwares:
;   emisor  -> T-Beam con HDC1080 + GPS. Chirp, pruning, bundling y TX por LoRa.
;   gateway -> segunda placa. Recibe por LoRa y reenvia por WiFi (HTTP) al
;              agente que corre en la EC2 (docker-compose).
;
; Compilar/subir uno u otro:
;   pio run -e emisor  -t upload
;   pio run -e gateway -t upload
; (o elegir el entorno en la barra inferior de VS Code)

[platformio]
default_envs = emisor

[env]
; Version fijada. Sin version, PlatformIO se quedaba con la que hubiera
; instalada (7.0.1), que trae Arduino-ESP32 2.0.17 sobre ESP-IDF 4.4: rama
; sin soporte. La 8.0.0 trae Arduino-ESP32 3.3.x.
platform = platformio/espressif32@8.0.0
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
lib_deps =
	sandeepmistry/LoRa@^0.8.0
	lewisxhe/XPowersLib@^0.3.3
	olikraus/U8g2@^2.36.18

[env:emisor]
build_src_filter = +<emisor/>
lib_deps =
	${env.lib_deps}
	mikalhart/TinyGPSPlus@^1.1.0
	closedcube/ClosedCube HDC1080@^1.3.2

[env:gateway]
build_src_filter = +<gateway/>
